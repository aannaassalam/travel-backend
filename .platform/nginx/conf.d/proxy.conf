# EB's nginx caps request bodies at 1 MB by default, which rejects every
# upload with a 413 before Node sees it. Sized for the largest thing the API
# takes — a 100 MB inventory video (MAX_VIDEO_BYTES in uploadController.ts) —
# with room for the multipart wrapping. Every other route keeps its own, much
# smaller, limit in the application.
client_max_body_size 110M;
# nginx takes in the whole body before passing it on (its default, kept on
# purpose): a 100 MB video on a slow line can take a quarter of an hour to
# arrive, and Node gives a request five minutes. Do not turn
# proxy_request_buffering off without raising server.requestTimeout.
