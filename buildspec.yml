### CodeBuild: compile TypeScript, then ship build/ + production deps to
### Elastic Beanstalk.
###
### The compile happens here rather than on the EB instance because `tsc` lives
### in devDependencies, and EB installs with `npm install --production` — the
### build would fail on the box with "tsc: not found". (That install flag does
### NOT set NODE_ENV for the running app; .ebextensions/01-env.config does.)
###
### Use the Amazon Linux 2023 CodeBuild image so the native module (argon2)
### compiles against the same libc the EB platform runs.
version: 0.2

phases:
   install:
      runtime-versions:
         nodejs: 22
   build:
      commands:
         # `npm install`, not `npm ci`: ci aborts the whole build the moment the
         # committed lock does not perfectly match what CodeBuild's npm resolves
         # (a different npm version or peer-dep mode is enough). install resolves
         # from package.json, reconciling the lock in place, so a lock drift
         # degrades to a warning instead of a failed deploy. Reproducibility is
         # preserved by committing the lock and the matching .npmrc.
         - npm install --no-audit --no-fund
         - npm run build
   post_build:
      commands:
         # Drop devDependencies (tsc etc.) from what ships, keeping the tree the
         # build already resolved — no second resolution that could disagree.
         - npm prune --omit=dev

artifacts:
   files:
      - build/**/*
      - node_modules/**/*
      - package.json
      - package-lock.json
      - Procfile
      - .platform/**/*
      - .ebextensions/**/*
